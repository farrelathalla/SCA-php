name: Deploy to staging

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build CSS
        run: |
          npm ci
          npm run build:css

      - name: Lint PHP
        run: find app public -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      # Uploads over FTPS, sending only files that changed since the last run.
      # Files the admin created on the server (uploads, config.local.php) are
      # never touched: they are not in this repository.
      - name: Upload to HostGator
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .github/**
            resources/**
            package.json
            package-lock.json
            README.md
            app/config.local.php
            public/uploads/20*/**

      - name: Smoke test
        run: |
          sleep 5
          curl -fsS -o /dev/null -w "home %{http_code}\n" "${{ secrets.SITE_URL }}/"
          curl -fsS -o /dev/null -w "admin %{http_code}\n" "${{ secrets.SITE_URL }}/admin/login"
